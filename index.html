<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>asiandiva.games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF4D6;
    --card:#FFFDF6;
    --ink:#4A3A24;
    --soft:#8A765A;
    --honey:#F5B92E;
    --rose:#F79BB8;
    --mint:#9FD8B8;
    --lilac:#B9A7EE;
    --shadow:rgba(122,95,48,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Instrument Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 24px 80px;
  }
  .wrap{max-width:960px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:56px 0 6px}
  .mark{
    font-family:"Fredoka",sans-serif;font-weight:700;
    font-size:clamp(36px,6.5vw,56px);letter-spacing:-.02em;line-height:1;
  }
  .mark b{color:var(--rose)}
  .tag{font-size:15px;color:var(--soft)}
  .tag a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--honey)}
  .tag a:hover{background:var(--honey)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:40px}
  .card{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border-radius:24px;overflow:hidden;
    box-shadow:0 3px 0 var(--shadow);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .art{height:152px;display:flex;align-items:center;justify-content:center}
  .art svg{width:100%;height:100%}
  /* drawn artwork fills the strip and is cropped from the middle */
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{padding:17px 19px 20px}
  .meta h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:21px;letter-spacing:-.01em}
  .meta p{font-size:14px;line-height:1.45;color:var(--soft);margin-top:5px}
  a.card:hover{transform:translateY(-5px);box-shadow:0 8px 0 var(--shadow)}
  .card.soon{opacity:.62}
  .card.soon .meta h2::after{
    content:"soon";font-family:"Instrument Sans",sans-serif;font-size:10px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;vertical-align:middle;
    margin-left:9px;padding:4px 9px;border-radius:99px;
    background:var(--paper);color:var(--soft);
  }
  a.card .meta h2::after{
    content:"play";font-family:"Instrument Sans",sans-serif;font-size:10px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;vertical-align:middle;
    margin-left:9px;padding:4px 9px;border-radius:99px;
    background:var(--mint);color:var(--ink);
  }
  /* a game that resets every night says so instead of just "play" */
  a.card.daily .meta h2::after{
    content:"daily";background:var(--honey);
  }

  footer{
    margin-top:66px;padding-top:28px;
    border-top:2px dotted rgba(122,95,48,.25);
    text-align:center;
  }
  .made{font-size:14px;color:var(--soft)}
  .made a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--honey)}
  .made a:hover{background:var(--honey)}

  .legal{margin-top:15px}
  .legal a{
    display:inline-block;
    font-size:11px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;
    color:var(--soft);text-decoration:none;
    padding-bottom:4px;
    border-bottom:2px solid transparent;
    transition:color .16s ease, border-color .16s ease;
  }
  .legal a:hover{color:var(--ink);border-bottom-color:var(--honey)}

  a:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:520px){header{padding-top:38px}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">asian<b>diva</b></div>
    <div class="tag">games i made instead of sleeping &middot; <a href="https://twitch.tv/asiandiva__">twitch</a> &middot; <a href="https://www.youtube.com/@asiandiva__">youtube</a></div>
  </header>

  <div class="grid">

    <a class="card daily" href="/sixtybucks">
      <div class="art" style="background:#FBDDE8">
        <svg viewBox="0 0 240 152" xmlns="http://www.w3.org/2000/svg">
          <!-- a game cover -->
          <rect x="42" y="24" width="104" height="104" rx="13" fill="#FFFDF6" stroke="#4A3A24" stroke-width="2.5"/>
          <path d="M44 96 L74 66 L96 88 L116 72 L144 100 L144 115 Q144 126 133 126 L55 126 Q44 126 44 115 Z" fill="#9FD8B8"/>
          <circle cx="118" cy="52" r="12" fill="#F5B92E"/>
          <rect x="42" y="24" width="104" height="104" rx="13" fill="none" stroke="#4A3A24" stroke-width="2.5"/>

          <!-- the price tag, hung over the corner -->
          <g transform="rotate(-11 176 92)">
            <path d="M132 70 L196 70 Q206 70 206 80 L206 104 Q206 114 196 114 L132 114 L118 92 Z"
                  fill="#F5B92E" stroke="#4A3A24" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="132" cy="92" r="5.5" fill="#FBDDE8" stroke="#4A3A24" stroke-width="2.5"/>
            <text x="168" y="101" font-family="Fredoka, sans-serif" font-size="27" font-weight="700"
                  fill="#4A3A24" text-anchor="middle">$?</text>
          </g>
        </svg>
      </div>
      <div class="meta">
        <h2>Sixty Bucks</h2>
        <p>Guess the price of six games a day. Are you a real gamer or not?</p>
      </div>
    </a>

    <a class="card" href="/diva-bingo">
      <div class="art" style="background:#FDE59C">
        <img src="/bingo.png" width="760" height="475" loading="lazy"
             alt="A duck sitting beside a bingo card with a line of daubed squares">
      </div>
      <div class="meta">
        <h2>Diva BINGO</h2>
        <p>Real bingo, called by a duck. One screen everybody watches, up to three cards each on your phones.</p>
      </div>
    </a>

  </div>

  <footer>
    <div class="made">made on weekends by <a href="https://twitch.tv/asiandiva__">asiandiva__</a></div>
    <div class="legal"><a href="/privacy">Privacy Policy</a></div>
  </footer>

</div>
</body>
</html>
